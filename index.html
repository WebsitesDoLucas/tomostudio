<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/tomologo.svg" />
    <title>tomo studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Splash screen CSS (inline para aparecer imediatamente) -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      
      .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }
      
      .splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .splash-logo {
        width: 60px;
        height: 60px;
        border: 2px solid #000;
        border-radius: 8px;
        animation: splash-pulse 1.5s ease-in-out infinite;
      }
      
      @keyframes splash-pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash screen que aparece imediatamente -->
    <div class="splash-screen" id="splashScreen">
      <div class="splash-logo"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash screen quando React renderizar
      window.__hideSplash = function() {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 300);
        }
      };
    </script>
    <form name="contacto" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="projectType"></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
  </body>
</html>
