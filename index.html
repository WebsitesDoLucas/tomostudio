<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/logo.webp?v=tomo_studio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="_XJI6wLUVm9WsEMfwfyDtqCKpZsZ2CI9zxuex72eiPw" />
    <title>Tomo Studio</title>
    <meta name="description" content="Na Tomo Studio ajudamos negócios a terem uma imagem tão boa como o serviço que prestam. Especialistas em Branding e Web Design em Viseu." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(0,0,0,0.1);
        border-top-color: black;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-spinner"></div>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      function hideLoader() {
        var loader = document.getElementById('initial-loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
          setTimeout(function() { loader.remove(); }, 300);
        }
      }
      // Fecha assim que o DOM básico estiver montado (Não espera por downloads externos eternos)
      window.addEventListener('DOMContentLoaded', hideLoader);
      // Fallback de segurança absoluto
      setTimeout(hideLoader, 1500);
    </script>
  </body>
</html>
